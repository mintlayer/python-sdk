[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mintlayer"
version = "0.1.0"
description = "Python SDK for the Mintlayer blockchain: node, indexer, and wallet RPC clients plus WASM cryptography and transaction building"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Mintlayer Institutional FZCO", email = "hello@mintlayer.org" }]
keywords = ["mintlayer", "blockchain", "sdk", "wallet", "crypto"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "requests>=2.31",
    "wasmtime>=25.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["mintlayer"]

[tool.hatch.build.targets.sdist]
include = ["mintlayer", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
